<!DOCTYPE html>

<title>Taskly – To-Do List</title>
<meta name="description" content="A clean, modern to-do list app.">

<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad-1: #e0e7ff;
    --bg-grad-2: #fce7f3;
    --card: #ffffff;
    --card-soft: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-soft: #eef2ff;
    --success: #10b981;
    --danger: #ef4444;
    --high: #ef4444;
    --medium: #f59e0b;
    --low: #10b981;
    --shadow: 0 10px 40px -12px rgba(30, 41, 99, .18);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #0b1020;
    --bg-grad-1: #1e1b4b;
    --bg-grad-2: #3b0a3f;
    --card: #141a2e;
    --card-soft: #1a2140;
    --text: #e8ecf8;
    --muted: #8b95b3;
    --border: #262e4d;
    --primary: #818cf8;
    --primary-dark: #6366f1;
    --primary-soft: #232a55;
    --shadow: 0 10px 40px -12px rgba(0, 0, 0, .6);
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, var(--bg-grad-1), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, var(--bg-grad-2), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    padding: 48px 16px 64px;
    transition: background .3s, color .3s;
  }
 
  .app { max-width: 720px; margin: 0 auto; }
 
  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, .6);
  }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
  .date { font-size: .85rem; color: var(--muted); margin-top: 2px; }
 
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; display: grid; place-items: center;
    transition: transform .15s, background .2s, border-color .2s;
    box-shadow: var(--shadow);
  }
  .icon-btn:hover { transform: translateY(-1px); border-color: var(--primary); }
  .icon-btn svg { width: 19px; height: 19px; }
 
  /* Card */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
 
  /* Stats */
  .stats { padding: 20px 22px; margin-bottom: 18px; }
  .stats-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .stats-top strong { font-size: 1rem; font-weight: 600; }
  .stats-top span { color: var(--muted); font-size: .88rem; }
  .progress { height: 10px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; }
  .progress > div {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), #a855f7);
    transition: width .5s cubic-bezier(.4, 0, .2, 1);
  }
 
  /* Add form */
  .add { padding: 18px; margin-bottom: 18px; }
  .add-row { display: flex; gap: 10px; }
  .add input[type="text"] {
    flex: 1; min-width: 0; padding: 14px 16px; font: inherit; font-size: .98rem;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card-soft); color: var(--text);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .add input::placeholder { color: var(--muted); }
  .add input:focus, .add select:focus, .add input[type="date"]:focus, .add input[type="time"]:focus {
    border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft);
  }
  .btn {
    padding: 0 22px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; font-size: .95rem;
    color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .8);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 18px; height: 18px; }
 
  .add-options { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .add select, .add input[type="date"], .add input[type="time"] {
    padding: 10px 12px; font: inherit; font-size: .88rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card-soft); color: var(--text); outline: none;
    transition: border-color .2s, box-shadow .2s; cursor: pointer;
  }
  [data-theme="dark"] input[type="date"], [data-theme="dark"] input[type="time"] { color-scheme: dark; }
 
  /* Toolbar */
  .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 2px; }
  .tab {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .86rem; font-weight: 500;
    padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: all .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px -4px rgba(99, 102, 241, .7); }
  .search {
    position: relative; flex: 1; min-width: 160px; max-width: 260px;
  }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .search input {
    width: 100%; padding: 10px 12px 10px 36px; font: inherit; font-size: .88rem;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
 
  /* List */
  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .task {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 2px 10px -6px rgba(15, 23, 42, .15);
    animation: pop .28s ease;
    transition: transform .2s, border-color .2s, opacity .2s, box-shadow .2s;
  }
  .task:hover { border-color: var(--primary); box-shadow: var(--shadow); }
  .task.removing { opacity: 0; transform: translateX(24px) scale(.98); }
  .task.dragging { opacity: .4; }
  .task.drag-over { border-color: var(--primary); border-style: dashed; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
 
  .grip { color: var(--muted); cursor: grab; opacity: .5; display: grid; place-items: center; }
  .grip svg { width: 16px; height: 16px; }
  .task:hover .grip { opacity: 1; }
 
  .check {
    appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex-shrink: 0;
    border: 2px solid var(--border); border-radius: 8px; cursor: pointer; display: grid; place-items: center;
    background: var(--card-soft); transition: all .2s;
  }
  .check:hover { border-color: var(--primary); }
  .check:checked { background: var(--success); border-color: var(--success); }
  .check:checked::after {
    content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .check:focus-visible { outline: 3px solid var(--primary-soft); outline-offset: 2px; }
 
  .body { flex: 1; min-width: 0; }
  .title {
    font-size: .98rem; font-weight: 500; word-break: break-word; cursor: text;
    transition: color .2s;
  }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .edit-input {
    width: 100%; font: inherit; font-size: .98rem; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--primary); background: var(--card-soft); color: var(--text); outline: none;
    box-shadow: 0 0 0 4px var(--primary-soft);
  }
  .meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; background: var(--card-soft); color: var(--muted);
    border: 1px solid var(--border);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.high .dot { background: var(--high); }
  .chip.medium .dot { background: var(--medium); }
  .chip.low .dot { background: var(--low); }
  .chip.overdue { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .chip.today { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 35%, transparent); background: color-mix(in srgb, var(--medium) 10%, transparent); }
 
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .task:hover .actions, .task:focus-within .actions { opacity: 1; }
  .act {
    width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s;
  }
  .act svg { width: 17px; height: 17px; }
  .act:hover { background: var(--primary-soft); color: var(--primary); }
  .act.del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
 
  /* Share buttons */
  .act.wa:hover { background: rgba(37, 211, 102, .14); color: #25d366; }
  .act.gm:hover { background: rgba(234, 67, 53, .12); color: #ea4335; }
  .act.li:hover { background: rgba(10, 102, 194, .14); color: #0a66c2; }
  .act.wa, .act.gm, .act.li { width: 32px; }
 
  /* Empty */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .art {
    width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 26px; background: var(--primary-soft);
    display: grid; place-items: center; color: var(--primary);
  }
  .empty .art svg { width: 40px; height: 40px; }
  .empty h3 { color: var(--text); font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
  .empty p { font-size: .9rem; }
 
  /* Footer */
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; color: var(--muted); font-size: .86rem; }
  .link-btn {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: .86rem; cursor: pointer;
    padding: 6px 10px; border-radius: 8px; transition: all .2s;
  }
  .link-btn:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
 
  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: .88rem; font-weight: 500;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 14px 40px -10px rgba(0,0,0,.4);
    transition: all .3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { background: none; border: 0; color: #a5b4fc; font: inherit; font-weight: 700; cursor: pointer; }
  [data-theme="dark"] .toast button { color: var(--primary-dark); }
 
  @media (max-width: 560px) {
    body { padding-top: 28px; }
    .actions { opacity: 1; }
    .task { flex-wrap: wrap; }
    .actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
    .btn span { display: none; }
    .btn { padding: 0 16px; }
    .grip { display: none; }
    .search { max-width: none; flex-basis: 100%; order: 2; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div>
        <h1>Taskly</h1>
        <div class="date" id="today"></div>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme"></button>
  </header>
 
  <section class="card stats" aria-label="Progress">
    <div class="stats-top">
      <strong id="progressTitle">Your progress</strong>
      <span id="progressText">0 of 0 done</span>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div id="progressFill"></div></div>
  </section>
 
  <form class="card add" id="addForm" autocomplete="off">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="200" aria-label="New task" required>
      <button class="btn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add task</span>
      </button>
    </div>
    <div class="add-options">
      <select id="priorityInput" aria-label="Priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <input type="date" id="dueInput" aria-label="Due date">
      <input type="time" id="timeInput" aria-label="Time">
    </div>
  </form>
 
  <div class="toolbar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab active" data-filter="all" role="tab">All</button>
      <button class="tab" data-filter="active" role="tab">Active</button>
      <button class="tab" data-filter="completed" role="tab">Completed</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks">
    </label>
  </div>
 
  <ul id="list" aria-live="polite"></ul>
 
  <div class="footer" id="footer">
    <span id="countText"></span>
    <button class="link-btn" id="clearBtn">Clear completed</button>
  </div>
</div>
 
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>
 
<script>
(() => {
  'use strict';
 
  const STORAGE_KEY = 'taskly.tasks.v1';
  const THEME_KEY = 'taskly.theme';
 
  const $ = (id) => document.getElementById(id);
  const els = {
    list: $('list'), form: $('addForm'), input: $('taskInput'), priority: $('priorityInput'), due: $('dueInput'), time: $('timeInput'),
    search: $('searchInput'), tabs: $('tabs'), count: $('countText'), clear: $('clearBtn'), footer: $('footer'),
    progressFill: $('progressFill'), progressText: $('progressText'), progressBar: $('progressBar'), progressTitle: $('progressTitle'),
    theme: $('themeBtn'), today: $('today'), toast: $('toast'), toastMsg: $('toastMsg'), undo: $('undoBtn')
  };
 
  const icons = {
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.43 15.1L2 22l5.04-1.32A9.93 9.93 0 1 0 12.04 2zm0 18.1c-1.5 0-2.97-.4-4.26-1.17l-.3-.18-3 .78.8-2.92-.2-.31a8.1 8.1 0 1 1 6.96 3.8zm4.45-6.06c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.8-.2-.47-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.5.58.18 1.1.16 1.51.1.46-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11.5H3V9.75zm6.5 0h3.83v1.57h.06c.53-1 1.84-2.07 3.78-2.07 4.04 0 4.78 2.66 4.78 6.12v5.88h-4v-5.2c0-1.24-.02-2.84-1.73-2.84-1.73 0-2 1.35-2 2.75v5.29h-4V9.75z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5h6M9 12l2 2 4-4"/></svg>'
  };
 
  // ---------- State ----------
  let tasks = load();
  let filter = 'all';
  let query = '';
  let lastDeleted = null;
  let toastTimer = null;
  let dragId = null;
 
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
 
  // ---------- Dates ----------
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  function fmtTime(time) {
    const [h, m] = time.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function nowHM() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  function formatDue(str, time) {
    const [y, m, d] = str.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const t = todayStr();
    const tom = new Date(); tom.setDate(tom.getDate() + 1);
    const tomStr = `${tom.getFullYear()}-${String(tom.getMonth() + 1).padStart(2, '0')}-${String(tom.getDate()).padStart(2, '0')}`;
    let label = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    let cls = '';
    if (str === t) { label = 'Today'; cls = 'today'; }
    else if (str === tomStr) { label = 'Tomorrow'; }
    else if (str < t) { cls = 'overdue'; label = 'Overdue · ' + label; }
    if (str === t && time && time < nowHM()) { cls = 'overdue'; label = 'Overdue · Today'; }
    if (time) label += ' · ' + fmtTime(time);
    return { label, cls };
  }
 
  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    els.theme.innerHTML = theme === 'dark' ? icons.sun : icons.moon;
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch {}
    const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  })();
  els.theme.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
 
  // ---------- Render ----------
  function visibleTasks() {
    const q = query.trim().toLowerCase();
    return tasks.filter(t => {
      if (filter === 'active' && t.done) return false;
      if (filter === 'completed' && !t.done) return false;
      if (q && !t.text.toLowerCase().includes(q)) return false;
      return true;
    });
  }
 
  function render() {
    els.list.innerHTML = '';
    const items = visibleTasks();
 
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      const msg = tasks.length === 0
        ? ['Nothing here yet', 'Add your first task above to get started.']
        : query ? ['No matches', 'Try a different search term.']
        : filter === 'completed' ? ['No completed tasks', 'Finish something and it will show up here.']
        : ['All caught up!', 'You have no active tasks. Enjoy the calm.'];
      li.innerHTML = `<div class="art">${icons.clipboard}</div><h3>${msg[0]}</h3><p>${msg[1]}</p>`;
      els.list.appendChild(li);
    } else {
      items.forEach(t => els.list.appendChild(buildItem(t)));
    }
    updateStats();
  }
 
  function buildItem(t) {
    const li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '');
    li.dataset.id = t.id;
    li.draggable = filter === 'all' && !query;
 
    const grip = document.createElement('span');
    grip.className = 'grip'; grip.innerHTML = icons.grip; grip.title = 'Drag to reorder';
 
    const check = document.createElement('input');
    check.type = 'checkbox'; check.className = 'check'; check.checked = t.done;
    check.setAttribute('aria-label', 'Mark "' + t.text + '" as complete');
 
    const body = document.createElement('div'); body.className = 'body';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t.text;
    title.title = 'Double-click to edit';
    body.appendChild(title);
 
    const meta = document.createElement('div'); meta.className = 'meta';
    const pri = document.createElement('span');
    pri.className = 'chip ' + t.priority;
    pri.innerHTML = '<span class="dot"></span>' + t.priority.charAt(0).toUpperCase() + t.priority.slice(1);
    meta.appendChild(pri);
    if (t.due) {
      const { label, cls } = formatDue(t.due, t.time);
      const due = document.createElement('span');
      due.className = 'chip ' + (t.done ? '' : cls);
      due.textContent = (t.time ? '⏰ ' : '📅 ') + label;
      meta.appendChild(due);
    }
    body.appendChild(meta);
 
    const actions = document.createElement('div'); actions.className = 'actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'act'; editBtn.innerHTML = icons.edit; editBtn.setAttribute('aria-label', 'Edit task'); editBtn.title = 'Edit';
    const delBtn = document.createElement('button');
    delBtn.className = 'act del'; delBtn.innerHTML = icons.trash; delBtn.setAttribute('aria-label', 'Delete task'); delBtn.title = 'Delete';
    const mkShare = (cls, icon, label, channel) => {
      const b = document.createElement('button');
      b.className = 'act ' + cls; b.innerHTML = icon; b.title = label; b.setAttribute('aria-label', label);
      b.addEventListener('click', () => shareTask(t, channel));
      return b;
    };
    actions.append(
      mkShare('wa', icons.whatsapp, 'Share on WhatsApp', 'whatsapp'),
      mkShare('gm', icons.mail, 'Share via Gmail', 'gmail'),
      mkShare('li', icons.linkedin, 'Share on LinkedIn', 'linkedin'),
      editBtn, delBtn
    );
 
    li.append(grip, check, body, actions);
 
    check.addEventListener('change', () => {
      t.done = check.checked; save();
      if (filter === 'all') { li.classList.toggle('done', t.done); updateStats(); }
      else render();
    });
    delBtn.addEventListener('click', () => removeTask(t.id, li));
    editBtn.addEventListener('click', () => startEdit(t, title));
    title.addEventListener('dblclick', () => startEdit(t, title));
 
    // Drag & drop reordering
    li.addEventListener('dragstart', (e) => {
      dragId = t.id; li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', t.id); } catch {}
    });
    li.addEventListener('dragend', () => {
      dragId = null; li.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(n => n.classList.remove('drag-over'));
    });
    li.addEventListener('dragover', (e) => { if (dragId) { e.preventDefault(); li.classList.add('drag-over'); } });
    li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
    li.addEventListener('drop', (e) => {
      e.preventDefault(); li.classList.remove('drag-over');
      if (!dragId || dragId === t.id) return;
      const from = tasks.findIndex(x => x.id === dragId);
      const to = tasks.findIndex(x => x.id === t.id);
      const [moved] = tasks.splice(from, 1);
      tasks.splice(to, 0, moved);
      save(); render();
    });
 
    return li;
  }
 
  function startEdit(t, titleEl) {
    const input = document.createElement('input');
    input.className = 'edit-input'; input.value = t.text; input.maxLength = 200;
    titleEl.replaceWith(input);
    input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      const v = input.value.trim();
      if (commit && v) { t.text = v; save(); }
      render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }
 
  function updateStats() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct = total ? Math.round((done / total) * 100) : 0;
    els.progressFill.style.width = pct + '%';
    els.progressBar.setAttribute('aria-valuenow', pct);
    els.progressText.textContent = total ? `${done} of ${total} done · ${pct}%` : 'No tasks yet';
    els.progressTitle.textContent = total && done === total ? '🎉 All done!' : 'Your progress';
    els.count.textContent = active === 1 ? '1 task remaining' : `${active} tasks remaining`;
    els.footer.style.display = total ? 'flex' : 'none';
    els.clear.style.visibility = done ? 'visible' : 'hidden';
  }
 
  // ---------- Actions ----------
  function shareMessage(t) {
    const lines = ['📌 ' + t.text];
    if (t.due) {
      const [y, m, d] = t.due.split('-').map(Number);
      const when = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      lines.push('🗓 ' + when + (t.time ? ' at ' + fmtTime(t.time) : ''));
    }
    lines.push('Priority: ' + t.priority.charAt(0).toUpperCase() + t.priority.slice(1));
    lines.push('Status: ' + (t.done ? 'Completed ✅' : 'Pending'));
    return lines.join('\n');
  }
 
  function shareTask(t, channel) {
    const text = shareMessage(t);
    const enc = encodeURIComponent;
    let url;
    if (channel === 'whatsapp') {
      url = 'https://wa.me/?text=' + enc(text);
    } else if (channel === 'gmail') {
      url = 'https://mail.google.com/mail/?view=cm&fs=1&su=' + enc((t.time ? 'Meeting / Task: ' : 'Task: ') + t.text) + '&body=' + enc(text);
    } else {
      url = 'https://www.linkedin.com/feed/?shareActive=true&text=' + enc(text);
      try { navigator.clipboard && navigator.clipboard.writeText(text); } catch {}
      showToast('Copied to clipboard — paste it in LinkedIn if needed');
    }
    window.open(url, '_blank', 'noopener');
  }
 
  // Reminders: alert when a task's due time arrives
  function checkReminders() {
    const now = Date.now();
    let changed = false;
    tasks.forEach(t => {
      if (t.done || t.notified || !t.due || !t.time) return;
      const [y, m, d] = t.due.split('-').map(Number);
      const [h, min] = t.time.split(':').map(Number);
      const ts = new Date(y, m - 1, d, h, min).getTime();
      if (now >= ts && now - ts < 5 * 60 * 1000) {
        t.notified = true; changed = true;
        showToast('⏰ Now: ' + t.text, null, 10000);
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Taskly reminder', { body: t.text });
          }
        } catch {}
      }
    });
    if (changed) save();
  }
 
  function addTask(text, priority, due, time) {
    if (time && !due) due = todayStr();
    if (time && 'Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch {}
    }
    tasks.unshift({ id: uid(), text, priority, due: due || '', time: time || '', done: false, notified: false, created: Date.now() });
    save();
    if (filter === 'completed') setFilter('all'); else render();
  }
 
  function removeTask(id, li) {
    const idx = tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const removed = tasks[idx];
    const commit = () => {
      tasks.splice(tasks.findIndex(t => t.id === id), 1);
      save(); render();
      lastDeleted = { task: removed, index: idx };
      showToast('Task deleted', () => {
        tasks.splice(Math.min(lastDeleted.index, tasks.length), 0, lastDeleted.task);
        save(); render(); lastDeleted = null;
      });
    };
    if (li) { li.classList.add('removing'); setTimeout(commit, 220); } else commit();
  }
 
  function clearCompleted() {
    const removed = tasks.filter(t => t.done);
    if (!removed.length) return;
    const backup = tasks.slice();
    tasks = tasks.filter(t => !t.done);
    save(); render();
    showToast(`${removed.length} completed task${removed.length > 1 ? 's' : ''} cleared`, () => {
      tasks = backup; save(); render();
    });
  }
 
  function setFilter(f) {
    filter = f;
    els.tabs.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.filter === f;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    render();
  }
 
  function showToast(msg, onUndo, duration) {
    els.toastMsg.textContent = msg;
    els.toast.classList.add('show');
    els.undo.style.display = onUndo ? '' : 'none';
    els.undo.onclick = () => { onUndo && onUndo(); hideToast(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, duration || 5000);
  }
  function hideToast() { els.toast.classList.remove('show'); }
 
  // ---------- Events ----------
  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    addTask(text, els.priority.value, els.due.value, els.time.value);
    els.input.value = ''; els.due.value = ''; els.time.value = ''; els.priority.value = 'medium';
    els.input.focus();
  });
  els.tabs.addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (b) setFilter(b.dataset.filter);
  });
  els.search.addEventListener('input', () => { query = els.search.value; render(); });
  els.clear.addEventListener('click', clearCompleted);
 
  // Keyboard shortcut: "/" focuses the add box
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      e.preventDefault(); els.input.focus();
    }
  });
 
  // ---------- Init ----------
  els.today.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  render();
  checkReminders();
  setInterval(() => { checkReminders(); render(); }, 30000);
})();
</script>
</body>
